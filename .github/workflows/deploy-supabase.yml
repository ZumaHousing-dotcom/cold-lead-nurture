name: Deploy to Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --remote --yes
      - run: supabase functions deploy webhook --remote="$PROJECT_REF" --no-verify-jwt --yes
      - run: supabase functions deploy abandon-job --remote="$PROJECT_REF" --no-verify-jwt --yes
